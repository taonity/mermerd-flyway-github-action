services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mermerd
      POSTGRES_PASSWORD: mermerd
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mermerd"]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:10.18.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      FLYWAY_USER: mermerd
      FLYWAY_PASSWORD: mermerd
      FLYWAY_SCHEMAS: public
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS}
    volumes:
      - ${WORKSPACE_PATH:-.}:/workspace
    depends_on:
      postgres:
        condition: service_healthy
