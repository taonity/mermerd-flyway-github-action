name: Generate Database ERD

on:
  workflow_call:
    inputs:
      migration_paths:
        description: 'Comma-separated list of migration SQL directory paths relative to repo root'
        required: true
        type: string
      readme_path:
        description: 'Path to the README file containing the mermaid block markers'
        required: false
        default: 'README.md'
        type: string
      tables_per_diagram:
        description: 'Tables per row in the name-first Mermaid grid (1, 2, or 3)'
        required: false
        default: 3
        type: number
      db_name:
        description: 'PostgreSQL database name for the temporary migration database'
        required: false
        default: 'mermerd_db'
        type: string
      schema_generator:
        description: 'Schema extractor: tbls (structured JSON) or mermerd (legacy Mermaid text)'
        required: false
        default: 'tbls'
        type: string
      tbls_version:
        description: 'tbls release version to use'
        required: false
        default: '1.96.1'
        type: string
      mermerd_version:
        description: 'Mermerd release version to use'
        required: false
        default: '0.13.0'
        type: string
      show_all_constraints:
        description: 'Show all constraints including those referencing non-selected tables'
        required: false
        default: true
        type: boolean
      show_descriptions:
        description: 'Comma-separated descriptions to show (enumValues, columnComments, notNull)'
        required: false
        default: 'enumValues,columnComments,notNull'
        type: string
      ignore_tables:
        description: 'Comma-separated list of table name patterns to ignore (supports regex)'
        required: false
        default: 'flyway_schema_history'
        type: string
      commit_message:
        description: 'Git commit message for the README update'
        required: false
        default: 'chore: update mermerd ERD diagram'
        type: string
      force_generate:
        description: 'Skip change detection and always generate the diagram (useful for initial setup or manual refresh)'
        required: false
        default: false
        type: boolean
      flyway_placeholder_prefix:
        description: 'Custom Flyway placeholder prefix (e.g. "{{ " for Helm-style templates)'
        required: false
        default: ''
        type: string
      flyway_placeholder_suffix:
        description: 'Custom Flyway placeholder suffix (e.g. " }}" for Helm-style templates)'
        required: false
        default: ''
        type: string
      flyway_placeholders:
        description: 'Comma-separated key=value placeholder pairs (e.g. app_user=dummy,app_password=dummy,db_name=mydb)'
        required: false
        default: ''
        type: string
      action_repository:
        description: 'The repository containing this reusable workflow (org/repo format)'
        required: false
        default: 'taonity/mermerd-flyway-github-action'
        type: string

jobs:
  generate-erd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for migration changes
        id: changes
        run: |
          IFS=',' read -ra PATHS <<< "${{ inputs.migration_paths }}"
          CHANGED=false

          if [[ "${{ inputs.force_generate }}" == "true" ]]; then
            echo "force_generate is set, skipping change detection"
            CHANGED=true
          elif ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "First commit detected, will generate diagram"
            CHANGED=true
          else
            for path in "${PATHS[@]}"; do
              path=$(echo "$path" | xargs)
              if git diff --name-only HEAD~1 HEAD -- "$path" | grep -q .; then
                CHANGED=true
                echo "Changes detected in: $path"
                break
              fi
            done
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Migration changes detected: $CHANGED"

      - name: Compute Flyway locations
        if: steps.changes.outputs.changed == 'true'
        id: flyway
        run: |
          IFS=',' read -ra PATHS <<< "${{ inputs.migration_paths }}"
          LOCATIONS=""
          for path in "${PATHS[@]}"; do
            path=$(echo "$path" | xargs)
            [ -n "$LOCATIONS" ] && LOCATIONS="${LOCATIONS},"
            LOCATIONS="${LOCATIONS}filesystem:/workspace/${path}"
          done
          echo "locations=$LOCATIONS" >> "$GITHUB_OUTPUT"
          echo "Flyway locations: $LOCATIONS"

      - name: Checkout action repository
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.action_repository }}
          path: .mermerd-action

      - name: Validate schema generator
        if: steps.changes.outputs.changed == 'true'
        env:
          SCHEMA_GENERATOR: ${{ inputs.schema_generator }}
        run: |
          case "$SCHEMA_GENERATOR" in
            tbls|mermerd) ;;
            *) echo '::error::schema_generator must be tbls or mermerd'; exit 1 ;;
          esac

      - name: Start PostgreSQL and run Flyway migrations
        if: steps.changes.outputs.changed == 'true'
        env:
          DB_NAME: ${{ inputs.db_name }}
          FLYWAY_LOCATIONS: ${{ steps.flyway.outputs.locations }}
          WORKSPACE_PATH: ${{ github.workspace }}
          INPUT_PLACEHOLDER_PREFIX: ${{ inputs.flyway_placeholder_prefix }}
          INPUT_PLACEHOLDER_SUFFIX: ${{ inputs.flyway_placeholder_suffix }}
          INPUT_PLACEHOLDERS: ${{ inputs.flyway_placeholders }}
        run: |
          docker compose -f .mermerd-action/docker-compose.yml up -d postgres

          FLYWAY_ENV_ARGS=()

          if [ -n "$INPUT_PLACEHOLDER_PREFIX" ]; then
            FLYWAY_ENV_ARGS+=(-e "FLYWAY_PLACEHOLDER_PREFIX=$INPUT_PLACEHOLDER_PREFIX")
          fi

          if [ -n "$INPUT_PLACEHOLDER_SUFFIX" ]; then
            FLYWAY_ENV_ARGS+=(-e "FLYWAY_PLACEHOLDER_SUFFIX=$INPUT_PLACEHOLDER_SUFFIX")
          fi

          if [ -n "$INPUT_PLACEHOLDERS" ]; then
            IFS=',' read -ra PAIRS <<< "$INPUT_PLACEHOLDERS"
            for pair in "${PAIRS[@]}"; do
              key=$(echo "$pair" | cut -d= -f1 | xargs | tr '[:lower:]' '[:upper:]')
              value=$(echo "$pair" | cut -d= -f2- | xargs)
              FLYWAY_ENV_ARGS+=(-e "FLYWAY_PLACEHOLDERS_${key}=${value}")
            done
          fi

          docker compose -f .mermerd-action/docker-compose.yml run --rm "${FLYWAY_ENV_ARGS[@]}" flyway

      - name: Download tbls
        if: steps.changes.outputs.changed == 'true' && inputs.schema_generator == 'tbls'
        env:
          TBLS_VERSION: ${{ inputs.tbls_version }}
        run: |
          curl -fsSL "https://github.com/k1LoW/tbls/releases/download/v${TBLS_VERSION}/tbls_v${TBLS_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin tbls
          chmod +x /usr/local/bin/tbls

      - name: Export PostgreSQL schema as tbls JSON
        if: steps.changes.outputs.changed == 'true' && inputs.schema_generator == 'tbls'
        env:
          DB_NAME: ${{ inputs.db_name }}
        run: |
          tbls out "postgres://mermerd:mermerd@localhost:5432/${DB_NAME}?sslmode=disable" \
            --include 'public.*' --format json --out /tmp/tbls-schema.json

      - name: Download mermerd
        if: steps.changes.outputs.changed == 'true' && inputs.schema_generator == 'mermerd'
        run: |
          VERSION="${{ inputs.mermerd_version }}"
          curl -fsSL "https://github.com/KarnerTh/mermerd/releases/download/v${VERSION}/mermerd_${VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin mermerd
          chmod +x /usr/local/bin/mermerd

      - name: Generate mermerd config and produce ERD
        if: steps.changes.outputs.changed == 'true' && inputs.schema_generator == 'mermerd'
        run: |
          {
            echo 'connectionString: "postgresql://mermerd:mermerd@localhost:5432/${{ inputs.db_name }}"'
            echo 'schema:'
            echo '  - "public"'
            echo 'useAllTables: true'
            echo 'showAllConstraints: ${{ inputs.show_all_constraints }}'
            echo 'encloseWithMermaidBackticks: true'
            echo 'outputFileName: "/tmp/mermerd-output.mmd"'
            echo 'debug: true'
            echo 'omitConstraintLabels: false'
            echo 'omitAttributeKeys: false'
            echo 'showDescriptions:'
            IFS=',' read -ra DESCS <<< "${{ inputs.show_descriptions }}"
            for d in "${DESCS[@]}"; do
              echo "  - $(echo "$d" | xargs)"
            done
            echo 'ignoreTables:'
            IFS=',' read -ra TABLES <<< "${{ inputs.ignore_tables }}"
            for t in "${TABLES[@]}"; do
              echo "  - $(echo "$t" | xargs)"
            done
          } > /tmp/mermerd.yaml

          echo "--- Generated mermerd.yaml ---"
          cat /tmp/mermerd.yaml
          echo "---"

          mermerd --runConfig /tmp/mermerd.yaml

      - name: Format Mermaid Markdown and update README
        if: steps.changes.outputs.changed == 'true'
        env:
          README_PATH: ${{ inputs.readme_path }}
          TABLES_PER_DIAGRAM: ${{ inputs.tables_per_diagram }}
          SCHEMA_PATH: ${{ inputs.schema_generator == 'tbls' && '/tmp/tbls-schema.json' || '/tmp/mermerd-output.mmd' }}
          IGNORE_TABLES: ${{ inputs.ignore_tables }}
          SHOW_DESCRIPTIONS: ${{ inputs.show_descriptions }}
          SHOW_ALL_CONSTRAINTS: ${{ inputs.show_all_constraints }}
        run: |
          python3 .mermerd-action/scripts/format-mermaid.py "$SCHEMA_PATH" \
            --readme "$README_PATH" \
            --tables-per-diagram "$TABLES_PER_DIAGRAM" \
            --ignore-tables "$IGNORE_TABLES" \
            --show-descriptions "$SHOW_DESCRIPTIONS" \
            --show-all-constraints "$SHOW_ALL_CONSTRAINTS"

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        env:
          README_PATH: ${{ inputs.readme_path }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- "$README_PATH"

          if git diff --cached --quiet; then
            echo "No changes to commit - diagram is already up to date"
          else
            git commit -m "$COMMIT_MESSAGE"
            git push
          fi

      - name: Cleanup Docker resources
        if: always()
        run: docker compose -f .mermerd-action/docker-compose.yml down -v 2>/dev/null || true
